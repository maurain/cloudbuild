name: build-android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (int: int preview release / prod: production release)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - int
      ref:
        description: 'Target branch / tag / commit SHA in nextie-ai/tuanziclient'
        required: false
        default: 'main'
        type: string
      architectures:
        description: 'Target architectures (default: arm64-v8a for modern devices; or arm64-v8a,armeabi-v7a)'
        required: false
        default: 'arm64-v8a'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'nextie-ai/tuanziclient'
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Gradle JVM memory and repository filtering
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.daemon=true
          EOF

          cat << 'EOF' > ~/.gradle/init.d/aliyun-filter.gradle
          allprojects {
            buildscript {
              repositories {
                all { ArtifactRepository repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("maven.aliyun.com")) {
                    content {
                      includeGroupByRegex "com\\.aliyun.*"
                      includeGroupByRegex "com\\.alibaba.*"
                    }
                  }
                }
              }
            }
            repositories {
              all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("maven.aliyun.com")) {
                  content {
                    includeGroupByRegex "com\\.aliyun.*"
                    includeGroupByRegex "com\\.alibaba.*"
                  }
                }
              }
            }
          }
          EOF

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: true

      - name: Configure Android signing credentials for EAS
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e "
          const fs = require('fs');
          const keystoreBase64 = process.env.KEYSTORE_BASE64?.trim();
          let keystoreConfig;

          if (keystoreBase64) {
            console.log('Using Release Keystore from GitHub Secrets...');
            fs.writeFileSync('release.keystore', Buffer.from(keystoreBase64, 'base64'));
            keystoreConfig = {
              keystorePath: 'release.keystore',
              keystorePassword: process.env.KEYSTORE_PASSWORD || '',
              keyAlias: process.env.KEY_ALIAS || '',
              keyPassword: process.env.KEY_PASSWORD || process.env.KEYSTORE_PASSWORD || ''
            };
          } else {
            console.log('ANDROID_KEYSTORE_BASE64 secret not set, falling back to local debug.keystore...');
            keystoreConfig = {
              keystorePath: 'android/app/debug.keystore',
              keystorePassword: 'android',
              keyAlias: 'androiddebugkey',
              keyPassword: 'android'
            };
          }

          fs.writeFileSync('credentials.json', JSON.stringify({ android: { keystore: keystoreConfig } }, null, 2));
          console.log('credentials.json generated successfully.');
          "

      - name: Bump EAS build number (odd for int, even for prod)
        run: |
          node scripts/bump-eas-version.js ${{ github.event.inputs.profile || 'prod' }} android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android App Locally
        run: |
          PROFILE="${{ github.event.inputs.profile || 'prod' }}"
          eas build --platform android --profile "$PROFILE" --local --non-interactive --output=app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ github.event.inputs.architectures || 'arm64-v8a' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC'"
          EAS_SKIP_AUTO_FINGERPRINT: "1"

      - name: Prepare APK for download
        id: prepare-apk
        run: |
          PROFILE="${{ github.event.inputs.profile || 'prod' }}"
          VERSION=$(node -p "try { require('./package.json').version } catch(e) { '' }")
          BUILD_NUM="${EAS_BUILD_NUMBER:-${GITHUB_RUN_NUMBER}}"
          
          if [ -n "$VERSION" ]; then
            APK_NAME="tuanzi-${PROFILE}-v${VERSION}-b${BUILD_NUM}.apk"
          else
            APK_NAME="tuanzi-${PROFILE}-b${BUILD_NUM}.apk"
          fi
          
          cp app.apk "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuanzi-${{ github.event.inputs.profile || 'prod' }}-apk
          path: ${{ steps.prepare-apk.outputs.apk_path }}
          retention-days: 30

      - name: Generate Job Summary
        if: always() && steps.prepare-apk.outputs.apk_path != ''
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 📱 Android APK 构建完成

          | 项目 | 信息 |
          | :--- | :--- |
          | **Profile** | \`${{ steps.prepare-apk.outputs.profile }}\` |
          | **Version** | \`${{ steps.prepare-apk.outputs.version }}\` |
          | **Build Number** | \`${{ steps.prepare-apk.outputs.build_num }}\` |
          | **APK 文件名** | \`${{ steps.prepare-apk.outputs.apk_name }}\` |
          | **目标架构** | \`${{ github.event.inputs.architectures || 'arm64-v8a' }}\` |
          | **分支 / Commit** | \`${{ github.event.inputs.ref || 'main' }}\` |

          ### ⬇️ APK 下载指引
          1. 滚动至当前页面底部的 **Artifacts** 区域；
          2. 点击 **\`tuanzi-${{ github.event.inputs.profile || 'prod' }}-apk\`** 进行下载；
          3. 解压下载的压缩包即可获得 **\`${{ steps.prepare-apk.outputs.apk_name }}\`** 安装包。
          EOF
