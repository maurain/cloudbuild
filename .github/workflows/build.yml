name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (int: int/testflight release / prod: production release)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - int
      ref:
        description: 'Target branch / tag / commit SHA in nextie-ai/tuanziclient'
        required: false
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'nextie-ai/tuanziclient'
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bump EAS build number (odd for int, even for prod)
        run: |
          node scripts/bump-eas-version.js ${{ github.event.inputs.profile || 'prod' }} ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Configure CocoaPods
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' 's|https://github.com/CocoaPods/Specs.git|https://cdn.cocoapods.org/|g' ios/Podfile
          else
            echo "ios/Podfile not found (managed by Expo prebuild), skipping."
          fi
          if [ -f ios/Podfile.lock ]; then
            sed -i '' 's|https://github.com/CocoaPods/Specs.git|trunk|g' ios/Podfile.lock
          fi

      - name: Build iOS App Locally
        run: |
          PROFILE="${{ github.event.inputs.profile || 'prod' }}"
          eas build --platform ios --profile "$PROFILE" --local --non-interactive --output=app.ipa

      - name: Submit to TestFlight / App Store
        run: |
          PROFILE="${{ github.event.inputs.profile || 'prod' }}"
          eas submit --platform ios --profile "$PROFILE" --path=app.ipa --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
