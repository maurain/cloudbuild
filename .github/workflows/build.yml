name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (testflight: int release / production: prod release)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - testflight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'nextie-ai/tuanziclient'
          token: ${{ secrets.GH_PAT }}

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: true
          
      - name: Bump EAS build number (odd for int, even for prod)
        run: |
          node scripts/bump-eas-version.js ${{ github.event.inputs.profile || 'production' }} ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          
      - name: Use CocoaPods CDN source
        run: |
          sed -i '' 's|https://github.com/CocoaPods/Specs.git|https://cdn.cocoapods.org/|g' ios/Podfile
          sed -i '' 's|https://github.com/CocoaPods/Specs.git|trunk|g' ios/Podfile.lock

      - name: Build iOS App Locally
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform ios --profile "$PROFILE" --local --non-interactive --output=app.ipa

      - name: Submit to TestFlight
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas submit --platform ios --profile "$PROFILE" --path=app.ipa --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
