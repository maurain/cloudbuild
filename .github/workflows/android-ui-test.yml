name: Android UI Automated Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview: int release / production: prod release)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      ref:
        description: 'Target branch / tag / commit SHA in nextie-ai/tuanziclient'
        required: false
        default: 'main'
        type: string
      api-level:
        description: 'Android API Level for emulator'
        required: false
        default: '33'
        type: choice
        options:
          - '31'
          - '33'
          - '34'
      release-tag:
        description: 'Release Tag on nextie-ai/tuanziclient (empty = auto: android-v<buildNumber>)'
        required: false
        default: ''
        type: string

# 并发控制：同一分支的最新提交自动取消旧的构建流程
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: EAS Build & Android Emulator UI Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 使用 GH_PAT 拉取目标仓库代码
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'nextie-ai/tuanziclient'
          token: ${{ secrets.GH_PAT || github.token }}
          ref: ${{ github.event.inputs.ref || 'main' }}

      # 2. 配置 Node.js 22.x（EAS CLI 最新依赖要求 Node >= 22）与 npm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # 4. 配置 JDK 17 与 Gradle 缓存（EAS local build 与 Maestro 需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 5. 安装并配置 Expo & EAS CLI
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: true
          packager: npm

      # 6. 自增 EAS Android 版本号（preview 为奇数，production 为偶数）
      - name: Bump EAS build number
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          node scripts/bump-eas-version.js "$PROFILE" android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 7. 使用 EAS 本地命令编译 Android APK
      # 设置 ORG_GRADLE_PROJECT_reactNativeArchitectures 同时编译 x86_64 (模拟器) 与 arm64-v8a (真机)
      - name: Build Android APK Locally via EAS
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --local --non-interactive --output=app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: 'x86_64,arm64-v8a'

      # 8. 配置 Linux KVM 硬件虚拟化权限，确保模拟器硬件加速正常工作
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 9. 安装 Maestro UI 自动化测试工具 CLI
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # 10. 启动 Android 模拟器并在其中执行自动化测试
      - name: Run Android UI tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '33' }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"

            echo "=== 等待 Android 模拟器准备就绪 ==="
            adb devices
            adb wait-for-device

            echo "=== 安装 EAS 编译生成的 App APK ==="
            adb install -r -d -g app.apk

            echo "=== 验证 App 安装成功 ==="
            adb shell pm list packages | grep com.nextie.tuanzi

            echo "=== 验证 Maestro CLI 运行环境 ==="
            maestro --version

            mkdir -p test-results screenshots

            echo "=== 开始执行 Maestro UI 自动化测试 ==="
            maestro test .maestro/smoke.yaml \
              --format junit \
              --output test-results/maestro-report.xml

      # 11. 测试失败时捕获 Android 系统 logcat 日志便于快速排查定位
      - name: Capture Android logcat on failure
        if: failure()
        run: |
          adb logcat -d > android-logcat.log || true

      # 12. 将编译产物 (APK) 与测试报告发布/上传至目标仓库 nextie-ai/tuanziclient 的 GitHub Release
      - name: Upload APK and artifacts to nextie-ai/tuanziclient
        if: always() && hashFiles('app.apk') != ''
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          TAG="${{ github.event.inputs.release-tag }}"
          if [ -z "$TAG" ]; then
            TAG="android-v${EAS_BUILD_NUMBER:-${GITHUB_RUN_NUMBER}}"
          fi

          TITLE="Android Build ${EAS_BUILD_NUMBER:-#$GITHUB_RUN_NUMBER} (${PROFILE})"
          NOTES="Automated Android EAS build ($PROFILE) and UI tests run from GitHub Actions."

          echo "Target repo: nextie-ai/tuanziclient, Tag: $TAG"

          if gh release view "$TAG" --repo nextie-ai/tuanziclient >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/updating assets..."
            gh release upload "$TAG" app.apk --repo nextie-ai/tuanziclient --clobber
            if [ -f test-results/maestro-report.xml ]; then
              gh release upload "$TAG" test-results/maestro-report.xml --repo nextie-ai/tuanziclient --clobber || true
            fi
          else
            echo "Creating new release $TAG on nextie-ai/tuanziclient..."
            gh release create "$TAG" app.apk \
              --repo nextie-ai/tuanziclient \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.event.inputs.ref || 'main' }}" \
              --prerelease
            if [ -f test-results/maestro-report.xml ]; then
              gh release upload "$TAG" test-results/maestro-report.xml --repo nextie-ai/tuanziclient --clobber || true
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      # 13. 同时将测试产物上传至当前 Runner 工作流（供网页直接下载查看截屏与日志）
      - name: Upload local workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: |
            test-results/
            screenshots/
            ~/.maestro/tests/
            android-logcat.log
            app.apk
          retention-days: 7
